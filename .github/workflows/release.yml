# Lint and tests on every push and PR. A push to main whose commits change
# package.json "version" publishes that version (D-007, D-021): a release is a commit
# that changes "version". "Run workflow" (manual) publishes the current version if it
# isn't on npm yet — e.g. the first time after Trusted Publishing is linked.
#
# npm access: Trusted Publishing (OIDC), no token. Linked once on npmjs.com →
# fundamentool → Settings → Trusted Publisher: GitHub Actions,
# mr-amirka/fundamentool, workflow release.yml.
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version before the push is read from history

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # No lockfile in the repo: inside the lab the package is a member of a
      # larger pnpm workspace, whose lockfile lives at the workspace root.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm validate

      - name: Did this push change the version? Is it on npm already?
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          previous=$(git show "$BEFORE:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
          if [ "$MANUAL" != "true" ] && [ "$previous" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged ($version), nothing to publish"
          elif npm view "fundamentool@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "fundamentool@$version is already published, nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1. prepublishOnly runs build and
      # test:dist (scripts/check-dist.mjs) before anything is uploaded.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: |
          npm install -g npm@^11.5.1
          npm publish
