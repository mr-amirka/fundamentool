# Lint and tests on every push and PR. On a push to main whose package.json version
# is not on npm yet, that version is published (D-007): a release is a commit that
# changes "version".
#
# npm access: Trusted Publishing (OIDC), no token. Linked once on npmjs.com →
# fundamentool → Settings → Trusted Publisher: GitHub Actions,
# mr-amirka/fundamentool, workflow release.yml. Then switched on with the repository
# variable NPM_PUBLISH = on (GitHub → Settings → Secrets and variables → Actions →
# Variables); until then pushes only validate (D-019).
name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # No lockfile in the repo: inside the lab the package is a member of a
      # larger pnpm workspace, whose lockfile lives at the workspace root.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm validate

      - name: Is this version already on npm?
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "fundamentool@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "fundamentool@$version is already published, nothing to do"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm >= 11.5.1. prepublishOnly runs build and
      # test:dist (scripts/check-dist.mjs) before anything is uploaded.
      - name: Publishing is switched off
        if: steps.version.outputs.publish == 'true' && vars.NPM_PUBLISH != 'on'
        run: echo "fundamentool@${{ steps.version.outputs.version }} is not on npm, but NPM_PUBLISH is not 'on' — skipped"

      - name: Publish
        if: steps.version.outputs.publish == 'true' && vars.NPM_PUBLISH == 'on'
        run: |
          npm install -g npm@^11.5.1
          npm publish
